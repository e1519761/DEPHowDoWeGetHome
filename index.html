<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8' />
    <title>How Do We Get Home?</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link rel="icon" type="image/x-icon"
        href="https://raw.githubusercontent.com/mapbox/assembly/publisher-staging/src/svgs/mapbox.svg">
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdn.jsdelivr.net/npm/mapbox-gl-globe-minimap@1.2.0/dist/bundle.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter Tight = clean grotesk, close to the WOB Studio look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        /* =====================================================
           TEXT COLOUR — one place to change it
           #463C35 = reference brown. Use #A02BD6 for your purple.
           ===================================================== */
        :root {
            --ink: #2B2B2B;
            /* FONT — one place to change it */
            --font: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        a,
        a:hover,
        a:visited {
            color: var(--ink);
            text-decoration: underline;
        }

        #map {
            top: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        /* keep all story text above the map */
        #story {
            position: relative;
            z-index: 1;
        }

        #mapInset {
            bottom: 50px;
            right: 30px;
            height: 180px;
            width: 250px;
            max-width: 100%;
            position: fixed;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        #mapInset .mapboxgl-ctrl-bottom-left {
            display: none;
        }

        /* ---- PAGE BUTTONS (1 2 3 … Next ›) ---- */
        .pager {
            display: flex;
            align-items: center;
            margin-top: 18px;
            padding: 0;
        }

        .pager button {
            font-family: var(--font);
            font-size: 12.8px;
            line-height: 1;
            color: var(--ink);
            background: transparent;
            border: 1px solid var(--ink);
            border-left-width: 0;
            min-width: 30px;
            height: 20px;
            padding: 0 8px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .pager button:first-child {
            border-left-width: 1px;
            border-radius: 10px 0 0 10px;
        }

        .pager button:last-child {
            border-radius: 0 10px 10px 0;
        }

        .pager button:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .pager button.current {
            background: var(--ink);
            color: #fff;
        }

        .pager button:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .pager button.journey {
            margin-left: 8px;
            border-left-width: 1px;
            border-radius: 10px;
            border-color: #E8622A;
            background: #E8622A;
            color: #fff;
            font-weight: 600;
            padding: 0 12px;
        }

        .pager button.journey:hover {
            background: #C94F1D;
            border-color: #C94F1D;
        }

        @media (max-width: 500px) {
            #mapInset {
                display: none;
            }
        }

        /* ---- HEADER: fixed top-left ---- */
        #header {
            position: fixed;
            top: 12px;
            left: 16px;
            z-index: 10;
            max-width: 55vw;
            pointer-events: none;
        }

        /* ---- MAIN TITLE (big logo, WOB style) ---- */
        #header h1 {
            margin: 0;
            font-size: clamp(20px, 4vw, 44px);   /* ← logo size: min, scales with screen, max */
            font-weight: 200;
            line-height: 0.95;
            letter-spacing: -0.035em;
            text-transform: uppercase;
            color: var(--ink);
        }

        /* ---- SMALL LINE UNDER TITLE (your name) ---- */
        #header h6 {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.2;
            color: var(--ink);
        }

        /* ---- INTRO PARAGRAPH (long subtitle, scrolls away) ---- */
        #intro {
            width: 460px;
            max-width: calc(100vw - 32px);
            margin-left: 16px;
            padding-bottom: 50vh;
        }

        #intro p {
            margin: 0;
            font-size: 12.8px;
            font-weight: 400;
            line-height: 1.75;
            color: var(--ink);
        }

        /* ---- FOOTER ---- */
        #footer {
            width: 460px;
            max-width: calc(100vw - 32px);
            margin-left: 16px;
            padding: 0 0 4vh;
            position: relative;
            z-index: 5;
        }

        #footer p {
            margin: 0;
            font-size: 12.8px;
            line-height: 1.4;
            color: var(--ink);
        }

        /* story starts just under the fixed title */
        #features {
            padding-top: 150px;      /* room for the bigger title */
            padding-bottom: 20vh;
        }

        .hidden {
            visibility: hidden;
        }

        .centered {
            width: 460px;
            margin: 0 auto;
        }

        /* left column, lined up with the title */
        .lefty {
            width: 460px;
            max-width: calc(100vw - 32px);
            margin-left: 16px;
        }

        .righty {
            width: 460px;
            margin-left: auto;
            margin-right: 16px;
        }

        .fully {
            width: 100%;
            margin: auto;
        }

        .light {
            color: var(--ink);
            background-color: transparent;
        }

        .dark {
            color: #f8f8f8;
            background-color: #463C35;
        }

        .step {
            padding-bottom: 50vh;
            opacity: 0.25;
            transition: opacity 0.4s ease;
        }

        .step.active {
            opacity: 1;
        }

        /* ---- CHAPTER PANEL ---- */
        .step div {
            padding: 0;
            background-color: transparent;
        }

        /* ---- CHAPTER TITLE ---- */
        .step h3 {
            margin: 0 0 8px 0;
            padding: 0;
            text-align: left;
            font-size: 18.4px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0;
            color: var(--ink);
        }

        /* ---- CHAPTER PARAGRAPH ---- */
        .step p {
            margin: 0;
            padding: 0;
            text-align: left;
            font-size: 12.8px;
            font-weight: 400;
            line-height: 1.75;
            color: var(--ink);
        }

        /* ---- IMAGES ---- */
        .step img {
            display: block;
            max-width: 100%;
            margin-top: 12px;
        }

        /* ☰ menu icon — thin lines */
        #menuButton svg {
            display: block;
            width: 24px;              /* ← icon size */
            height: 24px;
            fill: none;
            stroke: var(--ink);
            stroke-width: 1;          /* ← line thickness (thinner = smaller) */
            stroke-linecap: round;
        }

        #menuButton:hover svg { opacity: 0.6; }

        /* ---- TOP-RIGHT TEXT MENU (WOB style: plain caps, no boxes) ---- */
        #quickLinks {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 40;              /* stays visible above the menu blur */
            display: flex;
            align-items: center;
            gap: clamp(14px, 2vw, 28px);   /* ← space between words */
        }

        #quickLinks a,
        #quickLinks a:visited,
        #quickLinks button {
            font-family: var(--font);
            font-size: 13px;          /* ← text size */
            font-weight: 300;         /* ← thin (400 = regular) */
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1;
            color: var(--ink);
            text-decoration: none;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            white-space: nowrap;
        }

        #quickLinks a:hover,
        #quickLinks button:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* narrower screens: menu goes on its own row above the title */
        @media (max-width: 1100px) {
            #quickLinks {
                top: 16px;
                left: 16px;
                right: 16px;
                flex-wrap: wrap;
                gap: 10px 18px;
            }
            #header { top: 44px; max-width: calc(100vw - 32px); }
        }

        @media (max-width: 750px) {
            #header { top: 70px; }   /* menu may wrap to 2 rows on phones */
        }

        /* =====================================================
           MENU PANEL — opens from the ☰, covers 75% of the screen
           ===================================================== */
        #menu {
            position: fixed;
            inset: 0;                                 /* ← covers the whole screen */
            z-index: 9;                               /* under the title (10) so it stays crisp */
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 25vw 75vw;         /* ← nav 25% | text 75% */
            padding: 150px 0 48px;
            background: rgba(255, 255, 255, 0.7);     /* ← white at 70% */
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        #menu.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* left 25%: section list, right-aligned against a hairline */
        #menuNav {
            justify-self: end;
            align-self: start;
            list-style: none;
            margin: 0 3vw 0 0;
            padding: 0 24px 0 0;
            border-right: 1px solid var(--ink);
            text-align: right;
        }

        #menuNav li {
            padding: 9px 0;
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
            cursor: pointer;
        }

        #menuNav li:hover { opacity: 0.6; }

        #menuNav li.active {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* items that open another page get a small arrow */
        #menuNav li.is-link::after { content: ' \2197'; opacity: 0.5; }

        /* right: the text of the selected section */
                /* ---- MENU TEXT: spacing learned from the reference ---- */

        /* the text column (right 75%) */
        #menuPage {
            min-height: 0;
            overflow-y: auto;
            padding: 0 6vw 0 0;          /* rule 6: margin on the right */
        }

        /* section heading (h3): BIG gap above, small gap below */
        #menuPage h3 {
            margin: 56px 0 14px;          /* rule 1: above | sides | below */
            font-size: clamp(22px, 2.2vw, 32px);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }

        #menuPage h3:first-child { margin-top: 0; }   /* no gap above the very first heading */

        /* sub heading (h4): medium gap above, tiny gap below */
        #menuPage h4 {
            margin: 28px 0 6px;           /* rule 5: hugs the text under it */
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        #menuPage h3 + h4 { margin-top: 4px; }   /* h4 right under an h3 sits close */

        /* paragraphs */
        #menuPage p {
            margin: 0 0 14px;             /* rule 2: one-line gap between paragraphs */
            font-size: 15px;
            font-weight: 300;
            line-height: 1.55;            /* rule 3: comfortable line height */
        }

        /* lists */
        #menuPage ol,
        #menuPage ul {
            margin: 0 0 14px;
            padding-left: 30px;           /* rule 4: indent for the numbers / bullets */
        }

        #menuPage li {
            margin: 0 0 4px;              /* rule 4: tight gap between items */
            font-size: 15px;
            font-weight: 300;
            line-height: 1.55;
        }

        #menuPage li strong { font-weight: 500; }   /* bold lead-ins, not too heavy */

        /* "Our position" line */
        #menuPage .position {
            margin-top: 32px;
            font-size: 18px;
            font-style: italic;
            font-weight: 300;
            line-height: 1.5;

            
        }

        

/* FIVE RESEARCH COLUMNS */


/* FIVE RESEARCH COLUMNS */

#menuPage .walk-methods {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 22px;
    width: 100%;
    margin-top: 24px;
}

/* RESTORE ORIGINAL THIN LINES */

#menuPage .walk-method {
    min-width: 0;
    border-top: 1px solid var(--ink);
    padding-top: 14px;
}

/* ORIGINAL NUMBERED HEADINGS */

#menuPage .method-title {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
    color: var(--ink);
}

/* ORIGINAL DESCRIPTIONS */

#menuPage .walk-method p {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 300;
    line-height: 1.55;
    margin: 0;
    color: var(--ink);
}


/* =========================================
   FOUR WALK IMAGES — full width, whole photo shown
   ========================================= */

#menuPage .walk-gallery {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));   /* ← 4 images use the full width */
    gap: 22px;
    align-items: start;
    width: 100%;
    margin-top: 90px;
    padding-bottom: 30px;
}

/* captions sit above each image */
#menuPage .walk-caption {
    min-height: 85px;
    box-sizing: border-box;
    padding-bottom: 12px;
}

#menuPage .walk-title {
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 5px;
}

#menuPage .walk-caption p {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 300;
    line-height: 1.4;
    margin: 0;
}

/* frame height follows the column width */
#menuPage .walk-image {
    width: 100%;
    aspect-ratio: 4 / 5;   /* ← frame shape: 4/5 slightly tall, 1/1 square, 4/3 landscape */
    overflow: hidden;
}

#menuPage .walk-image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;     /* fills the frame, trims only the edges */
    object-position: center;
}

/* RESPONSIVE */

@media (max-width: 900px) {
    #menuPage .walk-methods {
        grid-template-columns: repeat(5, minmax(160px, 1fr));
        min-width: 850px;
    }
    #menuPage .walk-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

#menuPage .research-section {
    display: grid;
    grid-template-columns: 170px minmax(0, 1fr);
    column-gap: 25px;
    width: 100%;
    box-sizing: border-box;
    padding: 35px 0 65px;
    background: transparent;
}

#menuPage .research-section:first-child {
    padding-top: 15px;
}

/* LEFT SECTION HEADINGS */

#menuPage .research-heading span {
    display: block;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 400;
    line-height: 1.2;
    color: var(--ink);
}

#menuPage .research-heading h3 {
    margin: 2px 0 0;
    font-family: var(--font);
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.025em;
    line-height: 1.1;
    color: var(--ink);
}

/* ALL RIGHT-HAND CONTENT STARTS AT SAME POSITION */

#menuPage .research-content {
    min-width: 0;
    width: 100%;
    background: transparent;
}

/* =========================================
   DATA SOURCES + REGULATIONS TABLES
   ========================================= */


/* SHARED TABLE ALIGNMENT */

#menuPage .research-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    border-spacing: 0;
    border: none;
    background: transparent;
    font-family: var(--font);
    color: var(--ink);
}

/* COLUMN HEADINGS */

#menuPage .research-table th {
    text-align: left;
    vertical-align: top;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;

    border: none;
    border-top: 1px solid var(--ink);
    background: transparent;

    padding: 12px 16px 18px 0;
}

/* TABLE CONTENT */

#menuPage .research-table td {
    text-align: left;
    vertical-align: top;
    font-size: 12px;
    font-weight: 300;
    line-height: 1.5;

    border: none;
    background: transparent;

    padding: 7px 16px 7px 0;
}

/* SAME CONTENT POSITION FOR ALL SECTIONS */

#menuPage .research-section {
    display: flex;
    flex-direction: column;
    align-items: stretch;

    width: 100%;
    box-sizing: border-box;

    padding: 0 0 80px;
    margin: 0;

    background: transparent;
}

/* FIRST SECTION */

#menuPage .research-section:first-child {
    padding-top: 0;
}

/* HEADING AREA */

#menuPage .research-heading {
    width: 100%;
    margin-bottom: 28px;
}

/* SECTION NUMBER */

#menuPage .research-heading span {
    display: block;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 400;
    margin-bottom: 4px;
    color: var(--ink);
}

/* SECTION HEADING — SAME AS FOUR WALKS */

#menuPage .research-heading h3 {
    margin: 0;

    font-family: var(--font);
    font-size: clamp(22px, 2.2vw, 32px);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;

    color: var(--ink);
}

/* CONTENT UNDER HEADING */

#menuPage .research-content {
    width: 100%;
    min-width: 0;
    background: transparent;
}

/* REMOVE GREY SHADING */

#menuPage .research-table tr,
#menuPage .research-table thead,
#menuPage .research-table tbody,
#menuPage .research-table tbody tr:hover {
    background: transparent;
}

/* EMPHASIS */

#menuPage .research-emphasis td:first-child,
#menuPage .research-emphasis td:nth-child(3) {
    font-weight: 600;
}

/* DOWNLOAD NOTE */

#menuPage .research-note {
    margin: 20px 0 0;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 300;
}

/* =========================================
   PILOT PROJECTS — FULL WIDTH ROWS
   ========================================= */

#menuPage .pilot-list {
    display: flex;
    flex-direction: column;
    width: 100%;
}

/* EACH CLICKABLE ROW */

#menuPage .pilot-row {
    display: grid;

    /* YEAR | PROJECT | PLACE | ARROW */
    grid-template-columns: 75px minmax(0, 1fr) 125px 20px;

    column-gap: 14px;
    align-items: start;

    width: 100%;
    box-sizing: border-box;

    padding: 13px 0;

    border-top: 1px solid rgba(43,43,43,0.4);

    font-family: var(--font);
    font-size: 13px;
    font-weight: 300;
    line-height: 1.4;

    color: var(--ink);
    text-decoration: none;

    background: transparent;
    transition: opacity 0.2s ease;
}

/* LAST BOTTOM LINE */

#menuPage .pilot-row:last-child {
    border-bottom: 1px solid rgba(43,43,43,0.4);
}

/* YEAR */

#menuPage .pilot-year {
    font-size: 12px;
    font-weight: 300;
}

/* PROJECT TITLE */

#menuPage .pilot-name {
    font-size: 13px;
    font-weight: 400;
}

/* LOCATION */

#menuPage .pilot-place {
    font-size: 11px;
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: 0.02em;
}

/* ARROW */

#menuPage .pilot-arrow {
    font-size: 17px;
    font-weight: 300;
    text-align: right;
    line-height: 1;
}

/* HOVER EFFECT */

#menuPage .pilot-row:hover {
    opacity: 0.5;
    text-decoration: none;
}

#menuPage .pilot-row:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: 3px;
}

/* =========================================
   RESPONSIVE
   ========================================= */

@media (max-width: 1200px) {
    #menuPage .research-section {
        grid-template-columns: 120px minmax(0, 1fr);
        column-gap: 18px;
    }

    #menuPage .pilot-row {
        grid-template-columns: 55px minmax(0, 1fr) 85px 18px;
        gap: 10px;
    }
}

@media (max-width: 750px) {
    #menuPage .research-section {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 20px;
    }

    #menuPage .research-content {
        overflow-x: auto;
    }

    #menuPage .research-table {
        min-width: 600px;
    }

    #menuPage .pilot-row {
        grid-template-columns: 50px minmax(0, 1fr) 18px;
    }

    #menuPage .pilot-place {
        display: none;
    }
}

/* SHARED ALIGNMENT FOR DATA MANAGEMENT */

#menuPage {
    --management-gap: 22px;
    --management-columns: repeat(5, minmax(0, 1fr));
}

/* WORKFLOW COLUMNS */

#menuPage .management-workflow {
    display: grid;
    grid-template-columns: var(--management-columns);
    gap: var(--management-gap);
}

/* ROLES TABLE */

#menuPage .management-roles {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}

/* PRINCIPLE ROWS */

#menuPage .management-principle-row {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
gap: 22px;
    column-gap: var(--management-gap);
    align-items: start;
}


/* =========================================
   STORY CHAPTER NAVIGATION — TOP RIGHT
   ========================================= */

#chapterNav {
    position: fixed;
    top: 80px;
    right: 20px;
    z-index: 8;

    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 9px;

    max-width: 300px;

    font-family: var(--font);
    color: var(--ink);
}

/* INDIVIDUAL CHAPTER */

#chapterNav .chapter-link {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 12px;

    width: 100%;
    padding: 0;

    border: none;
    background: transparent;

    font-family: var(--font);
    font-size: 12px;
    font-weight: 300;
    line-height: 1.35;

    color: var(--ink);
    opacity: 0.4;

    text-align: right;
    cursor: pointer;

    transition: opacity 0.25s ease;
}

/* CHAPTER NUMBER */

#chapterNav .chapter-number {
    font-size: 10px;
    font-weight: inherit;
    flex-shrink: 0;
}

/* CHAPTER TITLE */

#chapterNav .chapter-name {
    font-size: 12px;
    font-weight: inherit;
}

/* ACTIVE CHAPTER — BOLD TEXT ONLY */

#chapterNav .chapter-link.active {
    font-weight: 600;
    opacity: 1;
    border: none;
    padding-left: 0;
}

/* NO VERTICAL INDICATOR LINE */

#chapterNav .chapter-link::before,
#chapterNav .chapter-link::after {
    display: none;
    content: none;
}

/* HOVER */

#chapterNav .chapter-link:hover {
    opacity: 1;
}

/* KEYBOARD FOCUS */

#chapterNav .chapter-link:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: 4px;
}

/* HIDE WHEN MENU OVERLAY IS OPEN */

body:has(#menu.open) #chapterNav {
    opacity: 0;
    pointer-events: none;
}

/* SMALLER SCREENS */

@media (max-width: 900px) {
    #chapterNav {
        top: 120px;
        right: 16px;
        max-width: 190px;
        gap: 7px;
    }

    #chapterNav .chapter-link,
    #chapterNav .chapter-name {
        font-size: 10px;
    }
}

@media (max-width: 600px) {
    #chapterNav {
        display: none;
    }
}


/* =========================================
   FIXED MAP LEGEND
   ========================================= */

#mapLegend {
    position: fixed;
    bottom: 45px;
    right: 25px;
    z-index: 8;

    width: 200px;
    max-width: 25vw;

    pointer-events: none;

    opacity: 0;
    transition: opacity 0.3s ease;
}

#mapLegend.visible {
    opacity: 1;
}

#mapLegend img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}

body:has(#menu.open) #mapLegend {
    opacity: 0;
}

/* MOBILE */

@media (max-width: 600px) {
    #mapLegend {
        width: 130px;
        bottom: 30px;
        right: 15px;
    }
}

/* HIDE OLD NUMBERED CHAPTER BUTTONS */

.pager {
    display: none !important;
}

/* =========================================
   SCROLLING STORY TEXT — FADE NEAR HEADER
   ========================================= */

/* Restore normal scrolling */

#features {
    padding-top: 150px;
    padding-bottom: 20vh;
}

.step {
    position: relative;

    width: 460px;
    max-width: calc(100vw - 32px);
    min-height: 100vh;

    margin-left: 16px;
    padding: 0;

    box-sizing: border-box;

    opacity: 1;
}

/* Text scrolls normally with the page */

.step > div {
    position: relative;
    top: auto;
    left: auto;

    width: 100%;
    max-width: 100%;

    opacity: 1;
    visibility: visible;
    pointer-events: auto;

    transform: none;
    transition: none;
}

/* Fade only when approaching the header */

.step > div {
    will-change: opacity;
}

/* Prevent active state from overriding fade */

.step.active > div {
    visibility: visible;
    transform: none;
}

/* Maintain left alignment */

.step.lefty {
    margin-left: 16px;
    margin-right: 0;
}

/* Mobile */

@media (max-width: 750px) {
    .step {
        width: 280px;
    }
}

/* ==================================================
   CHAPTER 09 — FINAL ORBIT GALLERY
   Upright cards / large ring / final viewport
   ================================================== */

:root {
    /* LEFT INTRODUCTION */
    --ch9-left-margin: 16px;
    --ch9-text-width: 460px;
    --ch9-text-top: 210px;

    /* RED BOUNDARY — RIGHT-HAND AREA */
    --ch9-area-left: 34%;
    --ch9-area-right: 20%;
    --ch9-area-top: 17%;
    --ch9-area-bottom: 12%;

    /* RING */
    --ch9-ring-size: min(42vw, 66vh);
    --ch9-orbit-radius: 39%;

    /* CARDS */
    --ch9-card-width: 145px;
    --ch9-card-height: 145px;
    --ch9-card-radius: 8px;

    /* ROTATION */
    --ch9-rotation-speed: 40s;
    --ch9-hover-scale: 1.15;
}

/* ==========================================
   FINAL CHAPTER — NO EXTRA SCROLL
   ========================================== */

#four-walks-finale.step {
    position: relative;
    display: block;

    width: 100%;
    max-width: 100%;

    height: 100vh;
    min-height: 100vh;

    margin: 0 !important;
    padding: 0 !important;

    box-sizing: border-box;
    overflow: visible;

    opacity: 1 !important;
}

/* GENERATED WRAPPERS */
#four-walks-finale.step > div,
#four-walks-finale .chapter-description {
    position: relative;

    width: 100%;
    max-width: 100%;

    height: 100%;
    min-height: 0;

    margin: 0;
    padding: 0;

    overflow: visible;

    opacity: 1 !important;
    visibility: visible !important;
}

/* FULL-SCREEN LAYOUT */
#four-walks-finale .ch9-layout {
    position: relative;
    display: block;

    width: 100%;
    height: 100vh;
    min-height: 0;

    margin: 0;
    padding: 0;

    box-sizing: border-box;
    overflow: visible;
}

/* ==========================================
   LEFT TEXT
   ========================================== */

#four-walks-finale .ch9-introduction {
    position: absolute;

    top: var(--ch9-text-top);
    left: var(--ch9-left-margin);

    width: var(--ch9-text-width);
    max-width: calc(100vw - 32px);

    margin: 0;
    padding: 0;

    z-index: 5;
}

#four-walks-finale .ch9-eyebrow {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.035em;
    margin: 0 0 20px;
}

#four-walks-finale .ch9-heading {
    font-family: var(--font);
    font-size: 28px;
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.025em;
    margin: 0 0 22px;
}

#four-walks-finale .ch9-summary {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 300;
    line-height: 1.55;
    margin: 0 0 28px;
}

#four-walks-finale .ch9-criteria {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

#four-walks-finale .ch9-criteria span {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 400;
    padding: 7px 10px;

    border: 1px solid rgba(43,43,43,0.3);
    background: rgba(255,255,255,0.3);
    border-radius: 4px;
}

#four-walks-finale .ch9-criteria span:first-child {
    border: none;
    background: transparent;
    padding-left: 0;
}

/* ==========================================
   RING AREA — INSIDE RED BOUNDARY
   ========================================== */

#four-walks-finale .ch9-gallery {
    position: absolute !important;

    left: var(--ch9-area-left) !important;
    right: var(--ch9-area-right) !important;
    top: var(--ch9-area-top) !important;
    bottom: var(--ch9-area-bottom) !important;

    width: auto !important;
    height: auto !important;
    max-width: none !important;
    aspect-ratio: auto !important;

    margin: 0 !important;
    padding: 0 !important;

    transform: none !important;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: visible;
    z-index: 3;
}

/* ==========================================
   ROTATING RING
   ========================================== */

#four-walks-finale .ch9-ring {
    position: relative;

    width: var(--ch9-ring-size);
    height: var(--ch9-ring-size);

    flex-shrink: 0;

    transform-origin: center center;

    animation:
        ch9-orbit
        var(--ch9-rotation-speed)
        linear infinite;
}

/* ==========================================
   FOUR CARDS — ORBIT POSITIONS
   ========================================== */

#four-walks-finale .ch9-walk {
    position: absolute;

    display: block;

    width: var(--ch9-card-width);
    height: auto;

    text-decoration: none;
    color: var(--ink);

    transform: translate(-50%, -50%);

    z-index: 2;
}

/* TOP */
#four-walks-finale .ch9-walk-1 {
    left: 50%;
    top: calc(50% - var(--ch9-orbit-radius));
}

/* RIGHT */
#four-walks-finale .ch9-walk-2 {
    left: calc(50% + var(--ch9-orbit-radius));
    top: 50%;
}

/* BOTTOM */
#four-walks-finale .ch9-walk-3 {
    left: 50%;
    top: calc(50% + var(--ch9-orbit-radius));
}

/* LEFT */
#four-walks-finale .ch9-walk-4 {
    left: calc(50% - var(--ch9-orbit-radius));
    top: 50%;
}

/* ==========================================
   COUNTER-ROTATION — ENTIRE CARD
   ========================================== */

#four-walks-finale .ch9-walk-inner {
    display: flex;
    flex-direction: column;

    width: 100%;

    transform-origin: center center;

    animation:
        ch9-counter-orbit
        var(--ch9-rotation-speed)
        linear infinite;

    transition: scale 0.35s ease;
}

/* Remove any old individual rotations */
#four-walks-finale .ch9-walk-label,
#four-walks-finale .ch9-walk-image {
    animation: none !important;
    transform: none;
}

/* ==========================================
   CARD TEXT
   ========================================== */

#four-walks-finale .ch9-walk-label {
    display: flex;
    flex-direction: column;
    gap: 4px;

    margin: 0 0 10px;
    padding: 0;
}

#four-walks-finale .ch9-walk-label span {
    font-family: var(--font);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.025em;
}

#four-walks-finale .ch9-walk-label strong {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 500;
}

/* ==========================================
   IMAGE FRAME
   ========================================== */

#four-walks-finale .ch9-walk-image {
    width: 100%;
    height: var(--ch9-card-height);

    border-radius: var(--ch9-card-radius);
    overflow: hidden;

    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(43,43,43,0.1);

    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

#four-walks-finale .ch9-walk-image img {
    display: block;
    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    transition: transform 0.4s ease;
}

/* ==========================================
   HOVER
   ========================================== */

#four-walks-finale .ch9-gallery:hover .ch9-ring,
#four-walks-finale .ch9-gallery:hover .ch9-walk-inner {
    animation-play-state: paused;
}

#four-walks-finale .ch9-walk:hover {
    z-index: 20;
}

#four-walks-finale .ch9-walk:hover .ch9-walk-inner {
    scale: var(--ch9-hover-scale);
}

#four-walks-finale .ch9-walk:hover img {
    transform: scale(1.04);
}

/* ==========================================
   CENTRE LABEL — DOES NOT ROTATE
   ========================================== */

#four-walks-finale .ch9-gallery-center {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    pointer-events: none;
    text-align: center;

    z-index: 1;
}

#four-walks-finale .ch9-gallery-center span {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.04em;
}

#four-walks-finale .ch9-gallery-center small {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 300;
    margin-top: 6px;
}

/* ==========================================
   ANIMATION
   ========================================== */

@keyframes ch9-orbit {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

@keyframes ch9-counter-orbit {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
}

/* ==========================================
   RESPONSIVE
   ========================================== */

@media (max-width: 1100px) {
    :root {
        --ch9-text-width: 35vw;
        --ch9-card-width: 115px;
        --ch9-card-height: 115px;
        --ch9-ring-size: min(38vw, 55vh);
    }
}

@media (max-width: 700px) {
    :root {
        --ch9-ring-size: 58vw;
        --ch9-card-width: 95px;
        --ch9-card-height: 95px;
    }

    #four-walks-finale.step,
    #four-walks-finale .ch9-layout {
        height: auto;
        min-height: 100vh;
    }

    #four-walks-finale .ch9-introduction {
        position: relative;
        top: auto;
        left: auto;

        width: auto;
        margin: 130px 16px 40px;
    }

    #four-walks-finale .ch9-gallery {
        position: relative !important;
        left: auto !important;
        right: auto !important;
        top: auto !important;
        bottom: auto !important;

        height: 70vh !important;
        margin: 0 auto !important;
    }
}

/* REDUCED MOTION */
@media (prefers-reduced-motion: reduce) {
    #four-walks-finale .ch9-ring,
    #four-walks-finale .ch9-walk-inner {
        animation: none !important;
    }
}

/* ==============================================
   CHAPTER 09 — REMOVE EXTRA BOTTOM SCROLL
   ============================================== */

#story {
    min-height: 0 !important;
    padding-bottom: 0 !important;
    margin-bottom: 0 !important;
}

#features {
    padding-bottom: 0 !important;

}

/* =====================================================
   NEW STORY — SCROLL BOXES, LAYER STEPS, BACKDROP, ICONS
   ===================================================== */

/* white scroll box that holds each chapter's text */
.step div.story-box {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(43,43,43,0.08);
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.06);
    padding: 28px 30px 26px;
}
.step .story-box h2 {
    margin: 0 0 16px;

    font-size: 28px;
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.025em;
}
.step .story-box p {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 300;
    line-height: 1.6;
}
.step .story-box p:last-child {margin-bottom: 0}
.step .story-box .story-ask {
    font-size: 18px;
    font-style: italic;
    font-weight: 400;
    margin-top: 18px;
}
.step .story-box .story-label {
    font-size: 11px;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
}
.story-data {

}
.story-data li {

}
.story-data strong {font-size: 20px; font-weight: 500; margin-right: 4px}
.story-data span {display: block; font-size: 11px; opacity: 0.55}

.step.layer-step {min-height: 75vh}
.step div.layer-box {
    display: inline-block;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);

.step.righty {

    margin-right: 3vw;

}

    /* drawing fills the right-hand column: same top as the text box,

    padding: var(--box-top) var(--gutter-r) 40px var(--col-right);

}

}
#four-walks-finale .ch9-walk-label strong {

#four-walks-finale .ch9-cta {

/* spin is driven by JavaScript (see "CHAPTER 04 — SPIN"), so it also runs

#four-walks-finale .ch9-walk-inner {

}

   CHAPTER 03 — MAP BEHIND, PHOTOS SCROLL UP AND DOWN
   text box stays on the left while its photos scroll past
   ===================================================== */
.step.photo-step {
    width: calc(100vw - 32px);
    max-width: none;
    min-height: 100vh;
    padding-bottom: 25vh;
}
/* text box and photos share one cell: text sticks on the left,
   photos scroll up through the middle of the screen */

    grid-template-columns: 1fr;
}
.photo-step .story-box {
    grid-area: 1 / 1;
    align-self: start;
    position: sticky;
    top: 200px;                    /* ← where the text box stops while photos scroll */
    width: 360px;
    max-width: 100%;
    box-sizing: border-box;
    z-index: 2;
}

    const clamp = value =>

    let ticking = false;

    function updateRoutes() {
        ticking = false;

        const rect = chapter.getBoundingClientRect();
        const vh = window.innerHeight;

        const totalScroll = Math.max(
            1,
            rect.height - vh
        );

        const progress = clamp(
            -rect.top / totalScroll
        );

        const stage = progress * (images.length - 1);

        images.forEach((image, index) => {

            const distance = Math.abs(stage - index);
            const opacity = clamp(1 - distance);

            image.style.transform =
                `translateY(${(1 - opacity) * 20}px)`;

        });

        if (ticking) return;

        ticking = true;
        requestAnimationFrame(updateRoutes);
    }

    window.addEventListener(
        'scroll',
        requestUpdate,
        { passive: true }
    );

    window.addEventListener(

        requestUpdate
    );

// the main colour of a Mapbox layer, if it is one plain colour
function layerColour(id) {
    var type = map.getLayer(id).type;
    var prop = { fill: 'fill-color', line: 'line-color', circle: 'circle-color',
                 'fill-extrusion': 'fill-extrusion-color', symbol: 'icon-color' }[type];

// Mapbox can't read 8-digit hex (#RRGGBBAA): turn it into rgba(), also inside expressions
function fixColour(v) {
    if (Array.isArray(v)) return v.map(fixColour);
    var m = typeof v === 'string' && /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(v);

    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' +
        Math.round(parseInt(m[4], 16) / 255 * 100) / 100 + ')';

// runs once the map style has loaded
function mapKeyOnLoad() {
    // 1. remove text labels (MRT station names), keep the icons
    (typeof MAP_HIDE_TEXT !== 'undefined' ? MAP_HIDE_TEXT : []).forEach(function (name) {
        layersStartingWith(name).forEach(function (l) {
            if (l.type === 'symbol') map.setLayoutProperty(l.id, 'text-field', '');
        });
    });
    // 2. draw the HDB layers at every zoom
    (typeof MAP_ALL_ZOOMS !== 'undefined' ? MAP_ALL_ZOOMS : []).forEach(function (name) {
        layersStartingWith(name).forEach(function (l) { map.setLayerZoomRange(l.id, 0, 24); });
    });
    // 3. repaint layers with the shared colours
    var recolour = (typeof MAP_RECOLOUR !== 'undefined') ? MAP_RECOLOUR : {};
    Object.keys(recolour).forEach(function (name) {
        var c = recolour[name];
        layersStartingWith(name).forEach(function (l) {
            if (l.type === 'fill') {
                map.setPaintProperty(l.id, 'fill-color', fixColour(c.fill));
                if (c.line) map.setPaintProperty(l.id, 'fill-outline-color', fixColour(c.line));
            } else if (l.type === 'fill-extrusion') {
                map.setPaintProperty(l.id, 'fill-extrusion-color', fixColour(c.fill));
            } else if (l.type === 'line') {
                map.setPaintProperty(l.id, 'line-color', fixColour(c.line || c.fill));
            } else if (l.type === 'circle') {
                map.setPaintProperty(l.id, 'circle-color', fixColour(c.fill));
                if (c.line) map.setPaintProperty(l.id, 'circle-stroke-color', fixColour(c.line));

    var extra = (typeof MAP_STYLE !== 'undefined') ? MAP_STYLE : {};
    Object.keys(extra).forEach(function (name) {
        layersStartingWith(name).forEach(function (l) {
            var e = extra[name];
            Object.keys(e.paint || {}).forEach(function (p) {
                try { map.setPaintProperty(l.id, p, fixColour(e.paint[p])); } catch (err) { console.warn(err); }
            });
            Object.keys(e.layout || {}).forEach(function (p) {
                try { map.setLayoutProperty(l.id, p, e.layout[p]); } catch (err) { console.warn(err); }
            });
        });
    });
    // 4. key: drop layers missing from the style, fill in 'auto' colours
    document.querySelectorAll('.map-key-item').forEach(function (li) {
        var name = li.getAttribute('data-layer');
        var hit = layersStartingWith(name)[0];
        if (!hit) { li.remove(); return; }
        var k = MAP_KEY_SAFE[name];
        if (k && k.colour === 'auto') {
            var c = layerColour(hit.id);
            if (c) li.querySelector('svg').outerHTML = mapKeySymbol(k.symbol, c, k.edge);
        }

        key.classList.toggle('is-empty', !key.querySelector('.map-key-item'));

(function initChapterThreeExit() {

    const chapter = document.getElementById(
        'where-the-childcare-is'
    );

    if (!chapter) return;

    const intro = chapter.querySelector(
        '.ch3-introduction'
    );

    const mainTitle = chapter.querySelector(
        '.ch3-heading'
    );

    const thirdFrame = chapter.querySelector(
        '.ch3-frame:last-child'
    );

    const thirdTitle = thirdFrame?.querySelector(
        '.ch3-frame-title'
    );

    if (!intro || !mainTitle || !thirdTitle) return;

    let ticking = false;

    function updateExit() {

        ticking = false;

        // Disable special behaviour on mobile
        if (window.innerWidth <= 900) {
            intro.style.setProperty(
                '--ch3-release-offset', '0px'
            );
            return;
        }

        const mainRect = mainTitle.getBoundingClientRect();
        const thirdRect = thirdTitle.getBoundingClientRect();

        // Main title's normal sticky position
        const stickyTop = parseFloat(
            getComputedStyle(intro).top
        ) || 210;

        const titleOffset =
            mainRect.top - intro.getBoundingClientRect().top;

        const targetY = stickyTop + titleOffset;

        // When image C title reaches the main title,
        // move the introduction upward with the page.
        const release = Math.min(
            0,
            thirdRect.top - targetY
        );

        intro.style.setProperty(
            '--ch3-release-offset',
            release + 'px'
        );
    }

    function requestUpdate() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(updateExit);
    }

    window.addEventListener(
        'scroll',
        requestUpdate,
        { passive: true }
    );

    window.addEventListener(
        'resize',
        requestUpdate
    );

    requestUpdate();

})();

// CHAPTER 05 — FADE CARDS + RELEASE LEFT TEXT
// ==========================================

(function initChapterFiveCards() {

    const chapter = document.getElementById(
        'news-and-complaints'
    );

    if (!chapter) return;

    const intro = chapter.querySelector(
        '.ch5-introduction'
    );

    const gallery = chapter.querySelector(
        '.ch5-gallery'
    );

    if (!intro || !gallery) return;

    const clamp = value =>
        Math.max(0, Math.min(1, value));

    const smoothstep = value => {
        const t = clamp(value);
        return t * t * (3 - 2 * t);
    };

    let ticking = false;

    function updateChapterFive() {

        ticking = false;

        // Mobile: normal scrolling
        if (window.innerWidth <= 700) {
            gallery.style.removeProperty('opacity');
            gallery.style.removeProperty('visibility');
            intro.style.removeProperty('--ch5-text-release');
            return;
        }

        const rect = chapter.getBoundingClientRect();
        const vh = window.innerHeight;

        // ------------------------------------
        // FADE IN
        // ------------------------------------

        const fadeIn = smoothstep(
            (vh * 0.85 - rect.top) / (vh * 0.25)
        );

        // ------------------------------------
        // FADE OUT
        // ------------------------------------

        const fadeOut = smoothstep(
            (rect.bottom - vh * 0.85) / (vh * 0.25)
        );

        // Shared opacity for all five cards
        const opacity = Math.min(fadeIn, fadeOut);

        gallery.style.opacity = opacity.toFixed(4);

        gallery.style.visibility =
            opacity <= 0.001 ? 'hidden' : 'visible';

        // ------------------------------------
        // LEFT TEXT RELEASE
        // ------------------------------------

        // Fade-out starts when the chapter bottom
        // crosses 110% of viewport height.
        const fadeOutStart = vh * 1.10;

        // Amount of scrolling beyond that point
        const releaseDistance = Math.max(
            0,
            fadeOutStart - rect.bottom
        );

        // Move left text upward at scroll speed
        intro.style.setProperty(
            '--ch5-text-release',
            (-releaseDistance).toFixed(2) + 'px'
        );
    }

    function requestUpdate() {
        if (ticking) return;

        ticking = true;
        requestAnimationFrame(updateChapterFive);
    }

    window.addEventListener(
        'scroll',
        requestUpdate,
        { passive: true }
    );

    window.addEventListener(
        'resize',
        requestUpdate
    );

    requestUpdate();

})();

// ==============================================
(function spinFourWalks() {
    var ring = document.querySelector('#four-walks-finale .ch9-ring');
    if (!ring) return;

    var SECONDS_PER_TURN = 30;         // ← lower = faster
    var inners = ring.querySelectorAll('.ch9-walk-inner');
    var angle = 0, last = null, paused = false;

    ring.querySelectorAll('.ch9-walk').forEach(function (walk) {
        walk.addEventListener('mouseenter', function () { paused = true; });
        walk.addEventListener('mouseleave', function () { paused = false; });
    });

    function tick(now) {
        if (last !== null && !paused) {
            angle = (angle + (now - last) * 360 / (SECONDS_PER_TURN * 1000)) % 360;
        }
        last = now;
        ring.style.transform = 'rotate(' + angle + 'deg)';
        inners.forEach(function (el) {
            el.style.transform = 'rotate(' + (-angle) + 'deg)';
        });
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
})();

        page.replaceChildren();
        page.append(el('h3', '', d.title));
        if (d.body) page.append(el('p', '', d.body));
        if (d.meta) {
            var meta = el('div', 'sp-d-meta');
            d.meta.forEach(function (m) {
                var c = el('div');
                c.append(el('b', '', m[0]), el('span', '', m[1]));
                meta.append(c);
            });
            page.append(meta);
        }
        if (d.photos && d.photos.length) {
            var g = el('div', 'sp-d-photos');
            d.photos.forEach(function (src) {
                var f = el('figure');
                var frame = el('div', 'sp-d-img');
                var img = new Image();
                img.src = src; img.alt = d.title; img.loading = 'lazy';
                img.addEventListener('click', function () { window.open(src, '_blank'); });
                frame.append(img);
                f.append(frame, el('figcaption', '', d.credit || ''));
                g.append(f);
            });
            page.append(g);
        }
        if (d.links && d.links.length) {
            var l = el('div', 'sp-d-links');
            d.links.forEach(function (x) {
                var a = el('a', '', x[0] + ' ↗');
                a.href = x[1]; a.target = '_blank'; a.rel = 'noopener noreferrer';
                l.append(a);
            });
            page.append(l);
        }
        page.scrollTop = 0;
        detail.classList.add('open');
        document.body.style.overflow = 'hidden';
        dClose.focus();
    }

    function closeDetail() {
        if (!detail.classList.contains('open')) return;
        detail.classList.remove('open');
        document.body.style.overflow = '';
        if (lastFocus) lastFocus.focus();
    }

    dClose.addEventListener('click', closeDetail);
    detail.addEventListener('click', function (e) {
        if (e.target === detail) closeDetail();          // click empty space to close
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeDetail();
    });

    function head(left, right) {
        var h = el('div', 'sp-head');
        var r = el('span', 'sp-hint', right || '');
        h.append(el('span', '', left), r);
        return { node: h, right: r };
    }

    function foot(text) { return el('div', 'sp-foot', text); }

    // ---------------- CHAPTER 2: FOUR ISSUE CARDS ----------------
    var issuesPanel = document.querySelector('.sp-panel[data-panel="issues"]');
    if (issuesPanel && P.issues) {
        var I = P.issues;
        var grid = el('div', 'sp-grid two');
        I.cards.forEach(function (c) {
            grid.append(card({
                kicker: c.kicker, title: c.title, sub: c.sub, photo: c.photo,
                detail: { kicker: c.detailKicker, title: c.detailTitle, body: c.body,
                          photos: c.photos, credit: I.photoCredit, links: c.links }
            }));
        });
        issuesPanel.append(head(I.head, I.hint).node, grid, foot(I.footnote));
    }

    // ---------------- CHAPTER 3: TABBED PANEL ----------------
    var respPanel = document.querySelector('.sp-panel[data-panel="responses"]');
    if (respPanel && P.responses) {
        var R = P.responses;
        var h = head(R.head, '');
        var tabs = el('div', 'sp-tabs');
        tabs.setAttribute('role', 'tablist');
        var body = el('div', 'sp-body');
        var footer = foot('');
        respPanel.append(h.node, tabs, body, footer);

        var pick = { project: 'All', topic: R.news.topics[0], source: R.news.sources[0], guide: 'All guides' };
        var currentTab = 0;

        // small friendly icons for the three pathways (ink + orange, like the rest of the site)
        var ICONS = {
            projects: '<svg viewBox="0 0 180 92" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 80H170" stroke="#2b2b2b" stroke-width="1.5"/><rect x="24" y="18" width="42" height="62" rx="6" fill="#f4efe7" stroke="#2b2b2b" stroke-width="1.8"/><g fill="#c6d1c7"><rect x="32" y="27" width="9" height="7" rx="2"/><rect x="49" y="27" width="9" height="7" rx="2"/><rect x="32" y="40" width="9" height="7" rx="2"/><rect x="49" y="40" width="9" height="7" rx="2"/><rect x="32" y="53" width="9" height="7" rx="2"/><rect x="49" y="53" width="9" height="7" rx="2"/></g><path d="M40 80V69a5 5 0 0 1 10 0V80" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><path d="M50 79C66 79 72 62 92 62S128 70 136 79" stroke="#E8622A" stroke-width="3" stroke-dasharray="0.1 7"/><path d="M98 80V40" stroke="#2b2b2b" stroke-width="1.8"/><path d="M88 36H110L117 43L110 50H88Z" fill="#E8622A" stroke="#E8622A" stroke-width="2"/><rect x="124" y="44" width="34" height="36" rx="6" fill="#e8eee8" stroke="#2b2b2b" stroke-width="1.8"/><path d="M135 80V71a6 6 0 0 1 12 0V80" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><path d="M141 34c-2.6-3.6-7.5-1.6-6.4 2.2C135.5 39.6 141 42 141 42s5.5-2.4 6.4-5.8c1.1-3.8-3.8-5.8-6.4-2.2Z" fill="#E8622A"/></svg>',
            news: '<svg viewBox="0 0 180 92" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M36 12H88a14 14 0 0 1 14 14V42a14 14 0 0 1-14 14H52L38 68V56h-2A14 14 0 0 1 22 42V26A14 14 0 0 1 36 12Z" fill="#f4efe7" stroke="#2b2b2b" stroke-width="1.8"/><g fill="#2b2b2b"><circle cx="48" cy="34" r="3.2"/><circle cx="62" cy="34" r="3.2"/><circle cx="76" cy="34" r="3.2"/></g><path d="M98 30H144a14 14 0 0 1 14 14V58a14 14 0 0 1-14 14H142V84L128 72H98A14 14 0 0 1 84 58V44A14 14 0 0 1 98 30Z" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/><path d="M121 45c-3-4.2-8.8-1.9-7.5 2.6C114.6 51.6 121 54.5 121 54.5s6.4-2.9 7.5-6.9c1.3-4.5-4.5-6.8-7.5-2.6Z" fill="#E8622A"/><path d="M104 63H138" stroke="#c6d1c7" stroke-width="3"/><path d="M164 22c3 3 3 9 0 12M170 17c5 5 5 17 0 22" stroke="#E8622A" stroke-width="1.8"/></svg>',
            guidance: '<svg viewBox="0 0 180 92" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M90 24C76 16 50 14 30 18V80C50 76 76 78 90 86C104 78 130 76 150 80V18C130 14 104 16 90 24Z" fill="#f4efe7" stroke="#2b2b2b" stroke-width="1.8"/><path d="M90 24V86" stroke="#2b2b2b" stroke-width="1.5"/><g stroke="#9da8a0" stroke-width="2.2"><path d="M42 32C56 30 68 31 78 35M42 44C56 42 68 43 78 47M42 56C54 54 64 55 72 58"/><path d="M102 35C112 31 124 30 138 32M102 47C110 44 118 43 126 44"/></g><rect x="102" y="54" width="30" height="14" rx="3" fill="#c6d1c7"/><path d="M106 54V59M112 54V61M118 54V59M124 54V61M130 54V59" stroke="#fff" stroke-width="1.4"/><g transform="rotate(-38 152 44)"><rect x="128" y="38" width="40" height="12" rx="3" fill="#E8622A"/><rect x="124" y="38" width="7" height="12" rx="2" fill="#f3b7a0"/><path d="M168 38L178 44L168 50Z" fill="#f4efe7" stroke="#2b2b2b" stroke-width="1.4"/><path d="M175 42.2L178 44L175 45.8Z" fill="#2b2b2b"/></g><path d="M24 8v8M20 12h8" stroke="#E8622A" stroke-width="1.8"/></svg>'
        };

        function filters(label, values, selected, onPick) {
            var row = el('div', 'sp-filters');
            row.append(el('span', 'sp-filter-label', label));
            values.forEach(function (v) {
                var b = el('button', v === selected ? 'current' : '', v);
                b.type = 'button';
                b.setAttribute('aria-pressed', String(v === selected));
                b.addEventListener('click', function () { onPick(v); });
                row.append(b);
            });
            return row;
        }

        function pad(n) { return String(n).padStart(2, '0'); }

        var renderers = [
            // 01 / At a glance
            function () {
                var O = R.overview;
                body.append(el('div', 'sp-intro', O.intro));
                var paths = el('div', 'sp-paths');
                O.paths.forEach(function (p) {
                    var b = el('button', 'sp-card');
                    b.type = 'button';
                    var icon;
                    if (p.photo) {
                        // picture frame (a missing photo shows a grey frame with its file name)
                        icon = el('div', 'sp-photo');
                        var img = document.createElement('img');
                        img.src = p.photo; img.alt = p.title; img.loading = 'lazy';
                        img.onerror = function () { icon.classList.add('missing'); };
                        icon.append(img, el('span', 'sp-photo-missing', 'add photo: ' + p.photo));
                    } else {
                        icon = el('div', 'sp-icon');
                        icon.innerHTML = ICONS[p.icon] || '';
                    }
                    b.append(icon, el('span', 'sp-kicker', p.index), el('span', 'sp-title', p.title),
                             el('span', 'sp-sub', p.who), el('span', 'sp-open', p.cta));
                    b.addEventListener('click', function () { show(p.tab); });
                    paths.append(b);
                });
                body.append(paths, el('div', 'sp-question', O.question));
                return { count: 'START HERE', foot: O.footnote };
            },
            // 02 / Built projects
            function () {
                var J = R.projects;
                body.append(filters(J.filterLabel, J.filters, pick.project, function (v) { pick.project = v; show(1, true); }));
                var items = J.items.filter(function (d) { return pick.project === 'All' || d.method === pick.project; });
                var g = el('div', 'sp-grid');
                items.forEach(function (d, i) {
                    g.append(card({
                        kicker: pad(i + 1) + ' / ' + d.tag, title: d.name, sub: d.short, photo: d.photo, open: 'EXPLORE ↗',
                        detail: { kicker: d.tag, title: d.name, body: d.body, links: d.links,
                                  meta: [['Method', d.method]] }
                    }));
                });
                body.append(g);
                return { count: items.length + ' ' + J.countLabel, foot: J.footnote };
            },
            // 03 / News & media
            function () {
                var N = R.news;
                body.append(
                    filters(N.topicLabel, N.topics, pick.topic, function (v) { pick.topic = v; show(2, true); }),
                    filters(N.sourceLabel, N.sources, pick.source, function (v) { pick.source = v; show(2, true); })
                );
                var items = N.items.filter(function (d) {
                    return (pick.topic === N.topics[0] || d.topic === pick.topic) &&
                           (pick.source === N.sources[0] || d.source === pick.source);
                });
                var g = el('div', 'sp-grid');
                items.forEach(function (d, i) {
                    g.append(card({
                        kicker: pad(i + 1) + ' / ' + d.source + ' · ' + d.tag, title: d.name, sub: d.short, open: 'EXPLORE ↗',
                        detail: { kicker: d.tag, title: d.name,
                                  body: d.body || (d.short + ' Open the linked source for full reporting and context.'),
                                  links: d.links, meta: [['Topic', d.topic], ['Source type', d.source]] }
                    }));
                });
                body.append(g);
                return { count: items.length + ' ' + N.countLabel, foot: N.footnote };
            },
            // 04 / Design guidance
            function () {
                var G = R.guidance;
                var names = ['All guides'].concat(G.groups.map(function (g) { return g.name; }));
                body.append(filters(G.filterLabel, names, pick.guide, function (v) { pick.guide = v; show(3, true); }));
                var total = 0;
                G.groups.forEach(function (grp) {
                    if (pick.guide !== 'All guides' && pick.guide !== grp.name) return;
                    var gh = el('div', 'sp-group-head');
                    gh.append(el('strong', '', grp.name), el('span', '', grp.help));
                    var g = el('div', 'sp-grid');
                    grp.items.forEach(function (d) {
                        total++;
                        g.append(card({
                            kicker: d.status, title: d.name, sub: d.use, open: 'READ GUIDE ↗',
                            detail: { kicker: 'DESIGN GUIDANCE', title: d.name, body: d.body,
                                      meta: [['Issuer', d.issuer], ['Status', d.status], ['Applies to', d.applies]],
                                      links: [['Open original source', d.url]] }
                        }));
                    });
                    body.append(gh, g);
                });
                return { count: total + ' ' + G.countLabel, foot: G.footnote };
            }
        ];

        R.tabs.forEach(function (t, i) {
            var b = el('button', '', t);
            b.type = 'button';
            b.setAttribute('role', 'tab');
            b.addEventListener('click', function () { show(i); });
            tabs.append(b);
        });

        // instant = filter change inside the same tab (no fade)
        function show(i, instant) {
            function draw() {
                currentTab = i;
                body.replaceChildren();
                var info = renderers[i]();
                h.right.textContent = info.count;
                footer.textContent = info.foot;
                tabs.querySelectorAll('button').forEach(function (b, j) {
                    b.classList.toggle('current', j === i);
                    b.setAttribute('aria-selected', String(j === i));
                });
                body.classList.remove('fading');
            }
            if (instant || !body.childNodes.length) { draw(); return; }
            body.classList.add('fading');
            setTimeout(draw, 250);
        }
        show(0);
    }

    // ---------------- PANELS FADE IN AND RISE AS THEY SCROLL IN ----------------
    // (same opacity + 20px rise as the route images)
    var panels = document.querySelectorAll('.sp-panel');
    if (!panels.length) return;
    var clamp = function (v) { return Math.max(0, Math.min(1, v)); };
    var smooth = function (v) { var t = clamp(v); return t * t * (3 - 2 * t); };
    var ticking = false;

    function update() {
        ticking = false;
        var vh = window.innerHeight;
        panels.forEach(function (p) {
            if (window.innerWidth <= 900) { p.style.opacity = ''; p.style.transform = ''; return; }
            var r = p.getBoundingClientRect();
            var o = Math.min(
                smooth((vh * 0.95 - r.top) / (vh * 0.3)),     // fade in from below
                smooth((r.bottom - vh * 0.15) / (vh * 0.3))   // fade out at the top
            );
            p.style.opacity = o.toFixed(3);
            p.style.transform = 'translateY(' + ((1 - o) * 20).toFixed(1) + 'px)';
        });
    }
    function request() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
    window.addEventListener('scroll', request, { passive: true });
    window.addEventListener('resize', request);
    request();
})();
</script>

<script>
/* hide the fixed chapter list, legend and minimap while the footer is on screen */
(function(){
    var f=document.querySelector('footer.site-footer');
    if(!f||!('IntersectionObserver' in window))return;
    new IntersectionObserver(function(e){
        document.body.classList.toggle('at-footer',e[0].isIntersecting);
    }).observe(f);
})();
</script>
</body>
